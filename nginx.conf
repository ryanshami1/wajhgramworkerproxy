events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 10000;
        port_in_redirect off;

        location / {
            proxy_pass https://wajhgram.ryan-shami.workers.dev;
            proxy_set_header Host wajhgram.ryan-shami.workers.dev;
            
            # Preserve user cookies for logins/sessions
            proxy_set_header Cookie $http_cookie;
            proxy_pass_header Set-Cookie;

            # Ensure proper SSL SNI handling for Cloudflare Workers
            proxy_ssl_server_name on;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;

            # Forward client IP headers
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
